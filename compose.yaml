services:
  corp-market:
    build:
      context: .
      dockerfile: Dockerfile
    image: eve-voice-pilot-corp-market:local
    restart: unless-stopped
    environment:
      CORP_MARKET_PUBLIC_HOSTING_MODE: "1"
      CORP_MARKET_PUBLIC_BASE_URL: "${CORP_MARKET_PUBLIC_BASE_URL:?set CORP_MARKET_PUBLIC_BASE_URL in .env}"
      CORP_MARKET_SSO_CALLBACK_URL: "${CORP_MARKET_SSO_CALLBACK_URL:?set CORP_MARKET_SSO_CALLBACK_URL in .env}"
      CORP_MARKET_SSO_CLIENT_ID: "${CORP_MARKET_SSO_CLIENT_ID:?set CORP_MARKET_SSO_CLIENT_ID in .env}"
      CORP_MARKET_SSO_CLIENT_SECRET_FILE: /run/secrets/corp_market_sso_client_secret
      CORP_MARKET_ALLOWED_CHARACTER_IDS: "${CORP_MARKET_ALLOWED_CHARACTER_IDS:-}"
      CORP_MARKET_ALLOWED_CORPORATION_IDS: "${CORP_MARKET_ALLOWED_CORPORATION_IDS:-}"
      CORP_MARKET_ALLOWED_ALLIANCE_IDS: "${CORP_MARKET_ALLOWED_ALLIANCE_IDS:-}"
      CORP_MARKET_ALLOW_ANY_AUTHENTICATED: "${CORP_MARKET_ALLOW_ANY_AUTHENTICATED:-0}"
      CORP_MARKET_ADMIN_TOKEN_FILE: /run/secrets/corp_market_admin_token
      CORP_MARKET_TRUSTED_MEMBERS_CAN_WRITE_MARKET: "${CORP_MARKET_TRUSTED_MEMBERS_CAN_WRITE_MARKET:-0}"
      CORP_MARKET_DISCORD_WEBHOOK_URL_FILE: /run/secrets/corp_market_discord_webhook_url
      CORP_MARKET_DISCORD_FORUM_TAG_IDS: "${CORP_MARKET_DISCORD_FORUM_TAG_IDS:-}"
      CORP_MARKET_DISCORD_FORUM_TAG_MAP: "${CORP_MARKET_DISCORD_FORUM_TAG_MAP:-}"
    expose:
      - "8770"
    volumes:
      - corp_market_profiles:/data/profiles
      - corp_market_cache:/data/cache
    secrets:
      - corp_market_sso_client_secret
      - corp_market_admin_token
      - corp_market_discord_webhook_url
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8770/api/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      corp-market:
        condition: service_started
    environment:
      CORP_MARKET_PUBLIC_HOST: "${CORP_MARKET_PUBLIC_HOST:-market.example.com}"
      CORP_MARKET_UPSTREAM: corp-market:8770
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  cache-refresh:
    profiles:
      - tools
    build:
      context: .
      dockerfile: Dockerfile
    image: eve-voice-pilot-corp-market:local
    command: ["python", "scripts/update_industry_recipe_cache.py"]
    volumes:
      - corp_market_cache:/data/cache

secrets:
  corp_market_sso_client_secret:
    file: ./deploy/docker/secrets/corp_market_sso_client_secret.txt
  corp_market_admin_token:
    file: ./deploy/docker/secrets/corp_market_admin_token.txt
  corp_market_discord_webhook_url:
    file: ./deploy/docker/secrets/corp_market_discord_webhook_url.txt

volumes:
  corp_market_profiles:
  corp_market_cache:
  caddy_data:
  caddy_config:
